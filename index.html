<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG + 实时联网 国际象棋</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 10px; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 房间控制面板 */
        .controls { margin-bottom: 20px; }
        input { padding: 8px 12px; margin: 5px; font-size: 14px; width: 130px; border: 1px solid #ccc; border-radius: 4px;}
        button { padding: 8px 15px; margin: 5px; font-size: 14px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        
        #room-info { display: none; background: #e3f2fd; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        #room-id-text { font-size: 24px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; margin: 5px 0;}
        #status { font-weight: bold; color: #333; margin-bottom: 15px; padding: 10px; background: #fff3e0; border-radius: 5px; display: none; }
        
        /* 棋盘 CSS 网格布局 */
        #board { display: none; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 450px; margin: 0 auto; border: 4px solid #444; border-radius: 2px; }
        .square { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        
        /* 棋盘格颜色 */
        .white-sq { background-color: #f0d9b5; }
        .black-sq { background-color: #b58863; }
        
        /* 高亮特效 */
        .selected { background-color: #baca44 !important; }
        .hint::after { content: ''; width: 25%; height: 25%; background-color: rgba(0,0,0,0.15); border-radius: 50%; position: absolute; }
        
        /* 防止点击事件穿透到SVG */
        .piece { width: 85%; height: 85%; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>♟️ 纯前端实时联机象棋</h2>
    
    <div class="controls" id="setup-panel">
        <button onclick="createRoom()">新建房间 (执白)</button>
        <div style="margin: 10px 0; color: #888; font-size: 14px;">— 或者 —</div>
        <input type="text" id="room-input" placeholder="输入4位房间号">
        <button onclick="joinRoom()">加入房间 (执黑)</button>
    </div>

    <div id="room-info">
        <div style="font-size: 14px;">当前房间号</div>
        <div id="room-id-text"></div>
        <div style="font-size: 12px; color: #666;" id="room-tip">请将号码发给对手，等待对方加入</div>
    </div>

    <div id="status"></div>
    <div id="board"></div>
</div>

<script src="https://cdn.staticfile.net/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.goeasy.io/goeasy-2.12.5.min.js"></script>

<script>
    // ==========================================
    // 1. 标准国际象棋 SVG 字典 
    // ==========================================

        'B': '<svg viewBox="0 0 45 45"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.46 3-2 3-2zm5-4c0-2.5 2.5-4 2.5-4s2.5 1.5 2.5 4c0 2.5-2.5 4-2.5 4s-2.5-1.5-2.5-4zm17 0c0-2.5-2.5-4-2.5-4s-2.5 1.5-2.5 4c0 2.5 2.5 4 2.5 4s2.5-1.5 2.5-4zM15 15.5c0-2.5 2.5-4 2.5-4s2.5 1.5 2.5 4c0 2.5-2.5 4-2.5 4s-2.5-1.5-2.5-4z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>',
        'Q': '<svg viewBox="0 0 45 45"><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-6-11-6 11-7-11 2 12z" fill="#fff" stroke="#000" stroke-width="1.5"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.56.5 2 13 2 19 2 6 0 18.5 0 19-2 0 0 2-1 .5-2.5 0 0 0-1.5-1.5-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-21-1.5-27 0z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>',
        'K': '<svg viewBox="0 0 45 45"><path d="M22.5 11.63V6M20 8h5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#fff" stroke="#000" stroke-width="1.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10.5 5 10.5v7z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>',
        'p': '<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>',
        'r': '<svg viewBox="0 0 45 45"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M34 14l-3 3H14l-3-3" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M31 17v12.5H14V17" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M11 14h23" fill="none" stroke="#fff" stroke-width="1.5"/></svg>',
        'n': '<svg viewBox="0 0 45 45"><path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18 C 22.5,14 20.5,13 18.5,13 C 14.5,13 12.5,16 12.5,19 C 12.5,23 16.5,27 16.5,27 C 16.5,27 11.5,24 10.5,19 C 9.5,14 13.5,10 18.5,10 C 19.5,10 21,10 22,10 z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>',
        'b': '<svg viewBox="0 0 45 45"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.46 3-2 3-2zm5-4c0-2.5 2.5-4 2.5-4s2.5 1.5 2.5 4c0 2.5-2.5 4-2.5 4s-2.5-1.5-2.5-4zm17 0c0-2.5-2.5-4-2.5-4s-2.5 1.5-2.5 4c0 2.5 2.5 4 2.5 4s2.5-1.5 2.5-4zM15 15.5c0-2.5 2.5-4 2.5-4s2.5 1.5 2.5 4c0 2.5-2.5 4-2.5 4s-2.5-1.5-2.5-4z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>',
        'q': '<svg viewBox="0 0 45 45"><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-6-11-6 11-7-11 2 12z" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.56.5 2 13 2 19 2 6 0 18.5 0 19-2 0 0 2-1 .5-2.5 0 0 0-1.5-1.5-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-21-1.5-27 0z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>',
        'k': '<svg viewBox="0 0 45 45"><path d="M22.5 11.63V6M20 8h5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10.5 5 10.5v7z" fill="#000" stroke="#fff" stroke-width="1.5"/></svg>'
    };

    // ==========================================
    // 2. 初始化 GoEasy 网络服务
    // ==========================================
    var goeasy = GoEasy.getInstance({
        host: "hangzhou.goeasy.io", 
        appkey: "BC-58fd21e3fbff443587a9b9f35137cb4e", // 【关键：请填入你的 Common Key】
        modules: ['pubsub']
    });

    goeasy.connect({
        onSuccess: function() { console.log("GoEasy 云服务连接成功！"); },
        onFailed: function(error) { 
            console.error("GoEasy 连接失败", error);
            alert("通信服务器连接被阻断。如果你在公司内网，建议切换至手机 4G/5G 网络后再试。"); 
        }
    });

    // 全局状态变量
    var game = new Chess();
    var currentRoom = "";
    var myColor = "white"; // 默认房主白棋
    var selectedSquare = null; // 当前选中的格子

    // ==========================================
    // 3. 房间控制与联机逻辑
    // ==========================================
    function createRoom() {
        myColor = "white"; 
        var roomId = Math.floor(1000 + Math.random() * 9000).toString();
        showGameUI(roomId);
        connectRoom(roomId);
    }

    function joinRoom() {
        var roomId = document.getElementById('room-input').value.trim();
        if(!roomId) { alert("请输入房间号！"); return; }
        myColor = "black"; 
        document.getElementById('room-tip').innerText = "你已加入房间，可以开始对弈";
        showGameUI(roomId);
        connectRoom(roomId);
    }

    function showGameUI(roomId) {
        currentRoom = roomId;
        document.getElementById('setup-panel').style.display = 'none';
        
        document.getElementById('room-info').style.display = 'block';
        document.getElementById('room-id-text').innerText = roomId;
        
        document.getElementById('status').style.display = 'block';
        document.getElementById('board').style.display = 'grid'; // 显示棋盘
        
        drawBoardDOM();
        updateBoardState();
    }

    // 监听网络，收到对方落子后更新本地棋盘
    function connectRoom(roomId) {
        goeasy.pubsub.subscribe({
            channel: roomId,
            onMessage: function(msg) {
                var data = JSON.parse(msg.content);
                if(data.type === 'move') {
                    game.load(data.fen);      // 同步对方的棋谱
                    selectedSquare = null;    // 清空选中状态
                    updateBoardState();       // 刷新棋盘画面
                }
            }
        });
    }

    // ==========================================
    // 4. SVG 棋盘绘制与核心交互逻辑
    // ==========================================
    function drawBoardDOM() {
        var boardDiv = document.getElementById('board');
        boardDiv.innerHTML = ''; 
        
        // 黑方翻转棋盘视角
        var ranks = myColor === 'black' ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
        var files = myColor === 'black' ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];

        for (var r of ranks) {
            for (var f of files) {
                var sqDiv = document.createElement('div');
                sqDiv.id = f + r; 
                
                var fileIndex = f.charCodeAt(0) - 'a'.charCodeAt(0) + 1;
                var isLight = (r + fileIndex) % 2 !== 0;
                sqDiv.className = 'square ' + (isLight ? 'white-sq' : 'black-sq');
                
                sqDiv.onclick = handleSquareClick; // 绑定点击事件
                boardDiv.appendChild(sqDiv);
            }
        }
    }

    function updateBoardState() {
        // 清理所有格子的棋子和高亮效果
        document.querySelectorAll('.square').forEach(function(sq) {
            sq.innerHTML = '';
            sq.classList.remove('selected', 'hint');
        });

        // 根据引擎数据放置 SVG 棋子
        var boardArray = game.board();
        var files = ['a','b','c','d','e','f','g','h'];
        for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
                var pieceInfo = boardArray[r][c];
                if (pieceInfo) {
                    var sqId = files[c] + (8 - r);
                    var pieceKey = pieceInfo.color === 'w' ? pieceInfo.type.toUpperCase() : pieceInfo.type.toLowerCase();
                    
                    var pieceDiv = document.createElement('div');
                    pieceDiv.className = 'piece';
                    pieceDiv.innerHTML = SVGS[pieceKey];
                    document.getElementById(sqId).appendChild(pieceDiv);
                }
            }
        }
        
        // 渲染选中高亮和可走提示点
        if (selectedSquare) {
            document.getElementById(selectedSquare).classList.add('selected');
            var moves = game.moves({ square: selectedSquare, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                document.getElementById(moves[i].to).classList.add('hint');
            }
        }

        updateStatusText();
    }

    // 点击走子逻辑 (第一下选中，第二下落子)
    function handleSquareClick(e) {
        if (game.game_over()) return;
        
        // 没轮到自己，不能操作
        var currentTurnColor = game.turn() === 'w' ? 'white' : 'black';
        if (currentTurnColor !== myColor) return;

        var sqId = e.currentTarget.id;
        
        if (selectedSquare) {
            // 尝试移动
            var move = game.move({
                from: selectedSquare,
                to: sqId,
                promotion: 'q'
            });
            
            if (move) {
                // 本地走棋成功，立即通过网络将 FEN 发给对方！
                selectedSquare = null;
                updateBoardState();
                
                try {
                    goeasy.pubsub.publish({
                        channel: currentRoom,
                        message: JSON.stringify({ type: 'move', fen: game.fen() })
                    });
                } catch (err) {
                    console.error("网络发送失败", err);
                }
            } else {
                // 如果点的是自己的另一个棋子，则切换选中目标
                var piece = game.get(sqId);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = sqId;
                    updateBoardState();
                } else {
                    selectedSquare = null;
                    updateBoardState();
                }
            }
        } else {
            // 第一次点击，选中自己的棋子
            var piece = game.get(sqId);
            if (piece && piece.color === game.turn()) {
                selectedSquare = sqId;
                updateBoardState();
            }
        }
    }

    function updateStatusText() {
        var statusEl = document.getElementById('status');
        var turnColor = game.turn() === 'w' ? '白方' : '黑方';
        
        if (game.in_checkmate()) {
            statusEl.innerText = '游戏结束，' + turnColor + ' 被将死！';
        } else if (game.in_draw()) {
            statusEl.innerText = '游戏结束，平局！';
        } else {
            var txt = `你是: ${myColor === 'white' ? '白棋' : '黑棋'} | 当前轮到: ${turnColor}`;
            if (game.in_check()) txt += ' (⚠️ 将军！)';
            statusEl.innerText = txt;
        }
    }
</script>
</body>
</html>
