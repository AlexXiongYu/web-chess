<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>纯前端国际象棋 (断线重连版)</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 10px; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls { margin-bottom: 20px; }
        input { padding: 8px 12px; margin: 5px; font-size: 14px; width: 130px; border: 1px solid #ccc; border-radius: 4px;}
        button { padding: 8px 15px; margin: 5px; font-size: 14px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        
        #resume-btn { background-color: #28a745; display: none; width: 80%; margin: 10px auto; font-weight: bold; }
        #resume-btn:hover { background-color: #218838; }

        #room-info { display: none; background: #e3f2fd; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        #room-id-text { font-size: 24px; font-weight: bold; color: #d32f2f; letter-spacing: 2px; margin: 5px 0;}
        #status { font-weight: bold; color: #333; margin-bottom: 15px; padding: 10px; background: #fff3e0; border-radius: 5px; display: none; }
        #network-warning { display: none; color: white; background: #d32f2f; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        
        #board { display: none; grid-template-columns: repeat(8, 1fr); width: 100%; max-width: 450px; margin: 0 auto; border: 4px solid #444; border-radius: 2px; }
        .square { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .white-sq { background-color: #f0d9b5; }
        .black-sq { background-color: #b58863; }
        
        .highlight-select { background-color: #baca44 !important; }
        .highlight-hint::after { content: ''; width: 26%; height: 26%; background-color: rgba(0,0,0,0.25); border-radius: 50%; position: absolute; pointer-events: none; }
        .in-check { box-shadow: inset 0 0 25px red !important; background-color: #ffcdd2 !important; }
        
        .piece-img { width: 90%; height: 90%; pointer-events: none; user-select: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>♟️ 实时联机象棋 (断线重连版)</h2>
    
    <div id="network-warning">⚠️ 检测到通信被拦截。当前仅支持同屏单机对战。</div>

    <div class="controls" id="setup-panel">
        <button id="resume-btn" onclick="resumeGame()">🔄 恢复刚才断线的对局</button>
        <button onclick="createRoom()">新建房间 (执白)</button>
        <div style="margin: 10px 0; color: #888; font-size: 14px;">— 或者 —</div>
        <input type="text" id="room-input" placeholder="输入4位房间号">
        <button onclick="joinRoom()">加入房间 (执黑)</button>
    </div>

    <div id="room-info">
        <div style="font-size: 14px;">当前房间号</div>
        <div id="room-id-text"></div>
        <div style="font-size: 12px; color: #666;" id="room-tip">请将号码发给对手，等待对方加入</div>
    </div>

    <div id="status">正在初始化游戏...</div>
    <div id="board"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/goeasy" onerror="document.getElementById('network-warning').style.display='block';"></script>

<script>
    // ==========================================
    // 1. 无依赖原生合成音效
    // ==========================================
    var audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol) {
        try {
            initAudio();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            var now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.start(now);
            osc.stop(now + duration);
        } catch(e) {}
    }

    function playAudioFeedback(move) {
        if (game.in_checkmate()) {
            playTone(150, 'sawtooth', 1.0, 0.8);
            setTimeout(() => playTone(100, 'sawtooth', 1.5, 0.8), 200);
        } else if (game.in_check()) {
            playTone(600, 'square', 0.15, 0.2);
            setTimeout(() => playTone(800, 'square', 0.2, 0.2), 150);
        } else if (move && move.captured) {
            playTone(800, 'triangle', 0.1, 0.3);
            playTone(400, 'triangle', 0.15, 0.3);
        } else {
            playTone(300, 'sine', 0.1, 0.3);
        }
    }

    // ==========================================
    // 2. 初始化网络与持久化逻辑
    // ==========================================
    var goeasy = null;
    var isNetworkReady = false;
    var game = new Chess();
    var currentRoom = "";
    var myColor = "white";
    var selectedSquare = null;

    if (typeof GoEasy !== 'undefined') {
        goeasy = GoEasy.getInstance({
            host: "hangzhou.goeasy.io", 
            appkey: "BC-58fd21e3fbff443587a9b9f35137cb4e", // 【替换为你的 Appkey】
            modules: ['pubsub']
        });
        goeasy.connect({
            onSuccess: function() { isNetworkReady = true; console.log("联机就绪"); },
            onFailed: function() { document.getElementById('network-warning').style.display='block'; }
        });
    }

    // 检查本地是否有上次的存档
    function checkSavedGame() {
        var saved = localStorage.getItem('chessSave');
        if (saved) {
            document.getElementById('resume-btn').style.display = 'inline-block';
        }
    }

    // 保存进度到浏览器
    function saveGameToLocal() {
        var data = { roomId: currentRoom, color: myColor, fen: game.fen() };
        localStorage.setItem('chessSave', JSON.stringify(data));
    }

    function createRoom() {
        initAudio(); 
        if (!isNetworkReady) return alert("当前离线，仅支持同机双人对战。");
        myColor = "white"; 
        var roomId = Math.floor(1000 + Math.random() * 9000).toString();
        
        // 新建房间时，清空旧的存档
        localStorage.removeItem('chessSave'); 
        game.reset();

        showGameUI(roomId);
        connectRoom(roomId);
        saveGameToLocal(); // 初始化存档
    }

    function joinRoom() {
        initAudio(); 
        if (!isNetworkReady) return alert("当前离线，仅支持同机双人对战。");
        var roomId = document.getElementById('room-input').value.trim();
        if(!roomId) return alert("请输入房间号！");
        
        myColor = "black"; 
        document.getElementById('room-tip').innerText = "你已加入房间，开始对弈";
        
        game.reset();
        showGameUI(roomId);
        connectRoom(roomId);
        saveGameToLocal(); 
    }

    // 断线恢复逻辑
    function resumeGame() {
        initAudio();
        var savedStr = localStorage.getItem('chessSave');
        if(!savedStr) return;
        var savedData = JSON.parse(savedStr);
        
        currentRoom = savedData.roomId;
        myColor = savedData.color;
        game.load(savedData.fen); // 恢复棋谱
        
        document.getElementById('room-tip').innerText = "断线重连成功";
        showGameUI(currentRoom);
        connectRoom(currentRoom);
    }

    function showGameUI(roomId) {
        currentRoom = roomId;
        document.getElementById('setup-panel').style.display = 'none';
        document.getElementById('room-info').style.display = 'block';
        document.getElementById('room-id-text').innerText = roomId;
        
        document.getElementById('status').style.display = 'block';
        document.getElementById('board').style.display = 'grid';
        drawBoardDOM();
        updateBoardState();
    }

    function connectRoom(roomId) {
        if(!goeasy) return;
        goeasy.pubsub.subscribe({
            channel: roomId,
            onMessage: function(msg) {
                var data = JSON.parse(msg.content);
                
                // 1. 正常落子 或 对手发来同步数据
                if(data.type === 'move' || data.type === 'sync') {
                    // 防止自己的棋谱被旧数据覆盖产生无限循环
                    if(game.fen() !== data.fen) {
                        game.load(data.fen);      
                        selectedSquare = null;
                        updateBoardState();
                        
                        // 只有新落子才播放音效
                        if(data.type === 'move') handleMoveAftermath(data.moveInfo, false);
                        else updateStatusText(); 
                    }
                }
                
                // 2. 握手机制：有人进房间请求同步，如果我有进度，就把我的 FEN 发给对方
                if(data.type === 'request_sync') {
                    // 只要棋局不是刚开局的初始状态，或者我已经走过棋了，就响应同步
                    if (game.history().length > 0) {
                        goeasy.pubsub.publish({
                            channel: currentRoom,
                            message: JSON.stringify({ type: 'sync', fen: game.fen() })
                        });
                    }
                }
            },
            onSuccess: function() {
                // 订阅房间成功后，立刻向房间内大吼一声“我刚加入，请把最新的棋盘发给我！”
                goeasy.pubsub.publish({
                    channel: currentRoom,
                    message: JSON.stringify({ type: 'request_sync' })
                });
            }
        });
    }

    // ==========================================
    // 3. 高清网格渲染与交互
    // ==========================================
    function drawBoardDOM() {
        var boardDiv = document.getElementById('board');
        boardDiv.innerHTML = ''; 
        var ranks = myColor === 'black' ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
        var files = myColor === 'black' ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];

        for (var r of ranks) {
            for (var f of files) {
                var sqDiv = document.createElement('div');
                sqDiv.id = f + r; 
                var fileIndex = f.charCodeAt(0) - 'a'.charCodeAt(0) + 1;
                sqDiv.className = 'square ' + ((r + fileIndex) % 2 !== 0 ? 'white-sq' : 'black-sq');
                
                sqDiv.onclick = handleSquareClick;
                boardDiv.appendChild(sqDiv);
            }
        }
    }

    function updateBoardState() {
        document.querySelectorAll('.square').forEach(function(sq) {
            sq.innerHTML = '';
            sq.classList.remove('highlight-select', 'highlight-hint', 'in-check');
        });

        var files = ['a','b','c','d','e','f','g','h'];
        for (var r = 1; r <= 8; r++) {
            for (var c = 0; c < 8; c++) {
                var sqId = files[c] + r;
                var pieceInfo = game.get(sqId); 
                
                if (pieceInfo) {
                    var pieceName = pieceInfo.color + pieceInfo.type.toUpperCase();
                    var img = document.createElement('img');
                    img.src = 'https://cdn.jsdelivr.net/gh/oakmac/chessboardjs@master/website/img/chesspieces/wikipedia/' + pieceName + '.png';
                    img.className = 'piece-img';
                    
                    var targetSquare = document.getElementById(sqId);
                    if(targetSquare) targetSquare.appendChild(img);
                }
            }
        }
        
        if (selectedSquare) {
            var selectedSqEl = document.getElementById(selectedSquare);
            if (selectedSqEl) selectedSqEl.classList.add('highlight-select');
            
            var moves = game.moves({ square: selectedSquare, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                var hintSquare = document.getElementById(moves[i].to);
                if(hintSquare) hintSquare.classList.add('highlight-hint');
            }
        }

        updateCheckVisuals();
        updateStatusText();
        saveGameToLocal(); // 每次画面更新都自动存档
    }

    function handleSquareClick(e) {
        if (game.game_over()) return;
        
        if (isNetworkReady && currentRoom !== "") {
            var currentTurnColor = game.turn() === 'w' ? 'white' : 'black';
            if (currentTurnColor !== myColor) return;
        }

        var sqId = e.currentTarget.id;
        
        if (selectedSquare) {
            var move = game.move({ from: selectedSquare, to: sqId, promotion: 'q' });
            if (move) {
                selectedSquare = null;
                updateBoardState();
                handleMoveAftermath(move, true);
            } else {
                var piece = game.get(sqId);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = sqId;
                    updateBoardState();
                } else {
                    selectedSquare = null;
                    updateBoardState();
                }
            }
        } else {
            var piece = game.get(sqId);
            if (piece && piece.color === game.turn()) {
                selectedSquare = sqId;
                updateBoardState();
            }
        }
    }

    function handleMoveAftermath(move, shouldBroadcast) {
        updateCheckVisuals();
        playAudioFeedback(move);
        updateStatusText();

        if (shouldBroadcast && isNetworkReady && currentRoom !== "") {
            try {
                goeasy.pubsub.publish({
                    channel: currentRoom,
                    message: JSON.stringify({ type: 'move', fen: game.fen(), moveInfo: move })
                });
            } catch(err){}
        }
    }

    function updateCheckVisuals() {
        if (game.in_check() || game.in_checkmate()) {
            var turn = game.turn();
            var files = ['a','b','c','d','e','f','g','h'];
            for (var r = 1; r <= 8; r++) {
                for (var c = 0; c < 8; c++) {
                    var sq = files[c] + r;
                    var p = game.get(sq);
                    if (p && p.type === 'k' && p.color === turn) {
                        var el = document.getElementById(sq);
                        if(el) el.classList.add('in-check');
                        return;
                    }
                }
            }
        }
    }

    function updateStatusText() {
        var statusEl = document.getElementById('status');
        var turnColor = game.turn() === 'w' ? '白方' : '黑方';
        if (game.in_checkmate()) {
            statusEl.innerText = '游戏结束，' + turnColor + ' 被将死！';
        } else if (game.in_draw()) {
            statusEl.innerText = '游戏结束，平局！';
        } else {
            if (isNetworkReady && currentRoom !== "") {
                var txt = `你是: ${myColor === 'white' ? '白棋' : '黑棋'} | 当前轮到: ${turnColor}`;
                if (game.in_check()) txt += ' (⚠️ 将军！)';
                statusEl.innerText = txt;
            } else {
                var txt = `本地单机模式 | 当前轮到: ${turnColor}`;
                if (game.in_check()) txt += ' (⚠️ 将军！)';
                statusEl.innerText = txt;
            }
        }
    }

    window.onload = function() {
        document.getElementById('status').style.display = 'block';
        checkSavedGame(); // 进页面先查档
    }
</script>
</body>
</html>
